<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal accounts</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#ececec; --muted:#9a9a9a; --line:#2a2a2a; --acc:#c4a574; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header, main { max-width: 860px; margin: 0 auto; padding: 24px 20px; }
  header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); }
  a { color: var(--acc); text-decoration: none; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  h2 { font-size: 16px; font-weight: 600; }
  .muted { color: var(--muted); }
  input, button, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); background: #1a1a1a; color: var(--fg); }
  button { cursor: pointer; background: var(--acc); color: #111; border: 0; font-weight: 600; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .card { border: 1px solid var(--line); padding: 16px; margin: 16px 0; }
  .err { color: #e08a8a; }
</style>
<body>
<header>
  <h1>Portal accounts</h1>
  <nav class="muted"><a href="#/">Sign in</a> · <a href="#/me">Account</a> · <a href="#/admin">Admin</a></nav>
</header>
<main id="app"></main>
<script>
const API = (location.origin + "/accounts/api/v1");
const $ = (s) => document.querySelector(s);
function token() { return localStorage.getItem("agp_access") || ""; }
function refresh() { return localStorage.getItem("agp_refresh") || ""; }
function setTokens(a, r) {
  if (a) localStorage.setItem("agp_access", a);
  if (r) localStorage.setItem("agp_refresh", r);
}
async function api(path, opts={}) {
  const headers = Object.assign({"content-type":"application/json"}, opts.headers||{});
  if (token()) headers.authorization = "Bearer " + token();
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  const text = await res.text();
  let body; try { body = JSON.parse(text); } catch { body = { raw: text }; }
  if (!res.ok) throw new Error((body.error && body.error.message) || res.statusText);
  return body;
}
function render() {
  const hash = location.hash.replace(/^#/, "") || "/";
  const app = $("#app");
  if (hash.startsWith("/verify")) {
    const q = new URLSearchParams(hash.split("?")[1] || "");
    app.innerHTML = "<p>Signing you in…</p>";
    api("/auth/verify", { method:"POST", body: JSON.stringify({ token: q.get("token") }) })
      .then(b => { setTokens(b.access_token, b.refresh_token); location.hash = "/me"; })
      .catch(e => { app.innerHTML = "<p class=err>"+e.message+"</p>"; });
    return;
  }
  if (hash.startsWith("/me")) {
    app.innerHTML = "<p>Loading…</p>";
    api("/me").then(async u => {
      const usage = await api("/me/usage").catch(() => ({ days: [] }));
      app.innerHTML = `<div class=card>
        <h2>${u.email}</h2>
        <p>Entitlement: <strong>${u.entitlement}</strong></p>
        <p class=muted>Trial ends: ${u.trial_ends_at || "—"} · Region: ${u.billing_region || "(set at checkout)"}</p>
        <div class=row>
          <button id="quote">Preview price</button>
          <button class=ghost id="portal">Manage billing</button>
          <button class=ghost id="out">Sign out</button>
        </div>
        <p id="price" class=muted></p>
        <h2>Usage</h2>
        <table><tr><th>Date</th><th>Requests</th><th>Tokens</th></tr>
        ${(usage.days||[]).map(d=>`<tr><td>${d.date}</td><td>${d.requests}</td><td>${d.tokens}</td></tr>`).join("") || "<tr><td colspan=3 class=muted>None yet</td></tr>"}
        </table>
      </div>`;
      $("#out").onclick = () => { api("/auth/logout", { method:"POST", body: JSON.stringify({ refresh_token: refresh() })}); localStorage.clear(); location.hash="/"; };
      $("#quote").onclick = async () => {
        const card = prompt("Card country (ISO, e.g. US)", "US");
        const bill = prompt("Billing country (ISO, e.g. BD)", "BD");
        try {
          const q = await api("/billing/quote", { method:"POST", body: JSON.stringify({ card_country: card, billing_country: bill })});
          $("#price").textContent = q.region + " · " + (q.amount_minor/100) + " " + q.currency.toUpperCase() + " / month";
        } catch (e) { $("#price").textContent = e.message; }
      };
      $("#portal").onclick = async () => {
        try { const p = await api("/billing/portal", { method:"POST", body: "{}" }); location.href = p.url; }
        catch (e) { alert(e.message); }
      };
    }).catch(e => { app.innerHTML = "<p class=err>"+e.message+"</p><p><a href='#/'>Sign in</a></p>"; });
    return;
  }
  if (hash.startsWith("/admin")) {
    app.innerHTML = "<p>Loading admin…</p>";
    api("/admin/users").then(b => {
      app.innerHTML = `<div class=card>
        <h2>Users</h2>
        <div class=row>
          <input id="em" placeholder="email@domain">
          <input id="reason" placeholder="comp reason">
          <button id="comp">Grant comp</button>
          <select id="ent"><option>trial</option><option>paid</option><option>comp</option><option>blocked</option></select>
          <button class=ghost id="set">Set entitlement</button>
          <button class=ghost id="rev">Revoke sessions</button>
        </div>
        <table><tr><th>Email</th><th>State</th><th>Region</th><th>Admin</th><th>Stripe</th></tr>
        ${(b.users||[]).map(u=>`<tr><td>${u.email}</td><td>${u.entitlement}</td><td>${u.billing_region||""}</td><td>${u.is_admin?"yes":""}</td><td>${u.stripe_customer_id||""}</td></tr>`).join("")}
        </table>
      </div>`;
      const email = () => $("#em").value;
      $("#comp").onclick = () => api("/admin/grant-comp", { method:"POST", body: JSON.stringify({ email: email(), reason: $("#reason").value })}).then(()=>location.reload());
      $("#set").onclick = () => api("/admin/set-entitlement", { method:"POST", body: JSON.stringify({ email: email(), entitlement: $("#ent").value })}).then(()=>location.reload());
      $("#rev").onclick = () => api("/admin/revoke-sessions", { method:"POST", body: JSON.stringify({ email: email() })}).then(()=>location.reload());
    }).catch(e => { app.innerHTML = "<p class=err>"+e.message+"</p>"; });
    return;
  }
  app.innerHTML = `<div class=card>
    <h2>Sign in</h2>
    <p class=muted>AI Access, billed monthly after trial. No country and no price on this screen.</p>
    <div class=row>
      <input id="email" type="email" placeholder="you@example.com" style="flex:1;min-width:220px">
      <button id="go">Email me a link</button>
    </div>
    <p id="msg" class=muted></p>
  </div>`;
  $("#go").onclick = async () => {
    try {
      const b = await api("/auth/magic-link", { method:"POST", body: JSON.stringify({ email: $("#email").value })});
      $("#msg").textContent = b.message + " Locally, the link is in the server log.";
    } catch (e) { $("#msg").textContent = e.message; }
  };
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
