[workspace]
resolver = "2"
members = ["crates/client", "crates/app", "crates/server", "crates/local-llm"]
# Throwaway ADR 0006 spike. Excluded so a plain `cargo build` here never drags
# llama.cpp — or a CUDA toolchain — into the app's build.
exclude = ["spike-llama"]

# The dev loop here is a release build — a debug-built iced app is not usable to
# click through — so `release` carries the incremental cache that `dev` normally
# would. Costs a `target/release/incremental` dir and a little optimisation
# across codegen units; buys not recompiling the world on a one-line change.
[profile.release]
incremental = true

# What `dist` builds release artifacts with. `release` plus thin LTO: the
# daemon is the deployable artifact and it is downloaded far more often than it
# is compiled. Config for `dist` itself is `../dist-workspace.toml`.
[profile.dist]
inherits = "release"
lto = "thin"
# The shipped artifact is optimised, not iterated on: incremental splits codegen
# units and would cost thin-LTO some of its inlining.
incremental = false

# `iced_term` 0.8 can be written into but not read from: `Terminal::backend` is
# `pub(crate)` and the widget exposes no accessor, so nothing outside that crate
# can see what the terminal shows. The Coder screen needs to — an agent command
# runs in the drawer and its output has to reach the model. The fork carries one
# method, `Terminal::text()`, and nothing else; it is upstream as a PR and this
# block comes out when that merges.
[patch.crates-io]
iced_term = { git = "https://github.com/tanvoid0/iced_term.git", branch = "feat/terminal-text" }

# Windows MSVC writes a .pdb per crate and full debuginfo into every rlib; with
# 1100+ dependencies that was 18G of .pdb alone in `target/debug`. Line tables
# keep `file:line` in backtraces, which is all a panic here is read for, and
# dependencies get nothing — nobody steps into `serde`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
