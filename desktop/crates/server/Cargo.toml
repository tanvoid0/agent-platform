[package]
name = "agent-platform-server"
# In lockstep with `agent-platform-desktop`: the two ship in one release, and
# `dist` derives the tag from the version, so a skew would mean two tags for
# one product. Bumped 0.1.0 → 0.2.0 to meet the app rather than moving the app
# backwards.
version = "0.4.0"
edition = "2021"
description = "Rust API server for agent-platform: migrated domains plus a reverse proxy to the Python server (ADR 0007)"
# `dist` requires this to generate GitHub CI; it is also what the generated
# installers point at to fetch a release.
repository = "https://github.com/tanvoid0/agent-platform"

[[bin]]
name = "agent-platformd"
path = "src/main.rs"

[dependencies]
# `multipart` for the two model-ops upload routes; nothing else in the crate
# takes a file.
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "signal", "sync"] }
# `stream` is what keeps SSE responses unbuffered through the proxy. No gzip
# feature on purpose: decompressing here would invalidate the headers we copy.
# `json` is used by the lib itself; without it here only `cargo test` builds,
# because the dev-dependency below unifies the feature back in.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# `migrate` is what `db::ensure_schema` runs — the versioned runner that
# replaced Alembic. It embeds `migrations/` into the binary, so the deployed
# artifact is still one file.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any", "chrono", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` so a JSON object round-trips in the order it was written
# rather than sorted — `serde_json::Map` is a `BTreeMap` without it. Kept now
# that the server it was matched against is gone, because response bodies are
# built by walking maps that were parsed from stored JSON, and re-ordering them
# changes token counts (`context_usage.categories.tools` measured 518 tokens in
# insertion order against 510 sorted) as well as what a client sees.
serde_json = { version = "1", features = ["preserve_order"] }
# Only ever deserialized into a `serde_json::Value` so the config tree is walked
# with the same API as everything else here. Archived upstream, which is fine for
# a read-only parse of two local files; swap for `saphyr` if that ever bites.
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
# Already in the tree via reqwest. Declared because the BYOK base-URL allowlist
# is an SSRF guard, and that is not a job for string splitting.
url = "2"
getrandom = "0.2"
subtle = "2"
futures = "0.3"
# Already in the tree via rustls. Declared because sd-server returns finished
# images and videos as base64 *inside* the poll body (ADR 0011) — megabytes of
# it, from another process. `api_tokens.rs` hand-rolls an encoder for one
# fixed-size token, which is a different problem: decoding arbitrary input with
# padding and whitespace is where a hand-rolled one goes quietly wrong.
base64 = "0.22"
# Real BPE, not an estimate. `context_usage` is a response body field on the
# chat routes, and the same count decides what `context_budget` drops when a
# prompt approaches the model's window — a character heuristic would trim a
# different set of messages, which is a behaviour difference, not a rounding
# one. The vocab ships in the crate.
tiktoken-rs = "0.6"
# Already in the tree via reqwest/hyper. Declared so a streamed chat response
# forwards its chunks through untouched instead of copying every SSE frame.
bytes = "1"
# `assistant/clarifying_form.py`'s field-kind inference and paren-option
# parsing are seven small patterns Python expresses as regexes; hand-rolling
# them risks a quieter divergence than pulling in the crate everyone already
# trusts for this. Already in the tree transitively (serde_yaml); declared
# directly because this is the first module that imports it.
regex = "1"
pdf-extract = "0.12"
async-stream = "0.3.6"
# CORS, plus `timeout` for `RequestBodyTimeoutLayer` — a slow request body is
# the one hang the per-call reqwest timeouts elsewhere cannot cover. Hand-rolling
# preflight is where people quietly get `Vary` wrong and poison a shared cache;
# this is the crate axum's own examples use.
tower-http = { version = "0.6", default-features = false, features = ["cors", "timeout"] }
# Host CPU/memory/disk for `GET /system/resources` (the Performance page's
# meters). Sampled on demand on a request the desktop was already making, never
# on a timer of its own. `system` + `disk` only: components (temperatures),
# networks and the user table are three more platform surfaces to build for
# numbers nothing reads. Pinned below 0.39 because that release needs Rust 1.95
# and this workspace is on 1.94.
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
# GPU load and VRAM for the same route. NVIDIA only, and that is the point:
# `nvml-wrapper` `dlopen`s the driver's own `nvml.dll` at runtime, so the build
# never depends on a GPU being present and a machine without one reports an
# empty list rather than failing to start. A vendor-neutral version means ROCm
# SMI and Level Zero too - three SDKs for one meter, and two of them untestable
# here.
nvml-wrapper = "0.12"
# ADR 0012: local inference is `llama-server`, a pinned upstream binary this
# daemon fetches and runs — no C++/CUDA toolchain in our build, and nothing to
# link. The in-process engine (`../local-llm`) is the desktop app's alone now.

[features]
default = []

[target.'cfg(windows)'.dependencies]
# Job object with kill-on-close: the only thing that reaps the Python child when
# this process is terminated rather than shut down. See upstream.rs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    # The extended limit struct is gated behind Threading; CreateJobObjectW takes
    # a SECURITY_ATTRIBUTES pointer, so it is gated behind Security.
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `oneshot`, to call the router as a `Service` with no socket in between. A body
# limit is rejected *while the client is still writing*, so over a real
# connection the client sees a reset rather than the 413 the server sent, and
# which of the two it sees depends on buffer sizes. Already in the tree via axum.
tower = { version = "0.5", features = ["util"] }
