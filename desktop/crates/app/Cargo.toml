[package]
name = "agent-platform-desktop"
version = "0.3.1"
edition = "2021"
description = "Native desktop app for agent-platform (iced), owning the Python server sidecar"

# Kept out of `dist`'s release: it links whisper.cpp through bindgen and has
# only ever been built on Windows, and `dist` has no per-package target list.
# Windows packaging is `.github/workflows/release-desktop.yml`.
[package.metadata.dist]
dist = false

[[bin]]
name = "agent-platform"
path = "src/main.rs"

[dependencies]
agent-platform-client = { path = "../client" }
bytemuck = { version = "1", features = ["derive"] }
iced = { version = "0.14", features = ["tokio", "canvas", "markdown", "svg", "image", "advanced"] }
# A real terminal emulator, not a parser of our own: alacritty_terminal's state
# machine (ANSI, scrollback, alt screen, mouse modes) behind an iced 0.14 canvas
# widget. The PTY is ConPTY on Windows.
iced_term = "0.8"
tray-icon = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "fs", "io-util"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
dark-light = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
rfd = { version = "0.15", features = ["common-controls-v6"] }
notify-rust = "4"
tts = "0.26"
msedge-tts = "0.2"
rodio = "0.19"
cpal = "0.15"
whisper-rs = "0.16"
reqwest = { version = "0.12", features = ["blocking", "stream", "rustls-tls"] }
iced_fonts = { version = "0.3.0", features = ["lucide", "advanced_text"] }
# Decodes the frames inside icon.ico for the window and tray icons. Already in
# the tree via iced's svg backend, so this costs no extra build.
png = "0.17"
# ADR 0006: llama.cpp in-process. Optional because the feature adds a C++ build
# (and a CUDA Toolkit for the `cuda` build) that nothing else in this crate
# needs. `encoding_rs` is llama-cpp-2's own decoder type, so its version has to
# match the one llama-cpp-2 pins.
llama-cpp-2 = { version = "0.1.154", default-features = false, optional = true }
encoding_rs = { version = "0.8.35", optional = true }

[features]
default = []
# `dynamic-link` is not optional here: whisper-rs-sys already links its own copy
# of ggml statically, and two static ggmls in one binary is hundreds of
# LNK2005s. Building llama.cpp as DLLs keeps the duplicate symbols out of the
# link — at the cost of shipping those DLLs beside the exe.
local-llm = ["dep:llama-cpp-2", "dep:encoding_rs", "llama-cpp-2/dynamic-link"]
# Accelerator for the above. CPU-only was measured at 11 tok/s against 123 on
# the GPU, so a shipped build wants one of these, and each needs its own SDK
# installed — see desktop/spike-llama/README.md.
cuda = ["local-llm", "llama-cpp-2/cuda"]

[dev-dependencies]
# Validates the orb's WGSL in a test; a shader typo is otherwise a panic on
# the landing page, where it is far more expensive to find.
naga = { version = "27", features = ["wgsl-in"] }
tokio = { version = "1", features = ["macros"] }

[target.'cfg(windows)'.dependencies]
# The Coder preview pane: a WebView2 surface parented into our own window. iced
# has no web engine and never will, so the page is a child window drawn over the
# strip the layout reserves for it — see src/coder_browser.rs. Windows-only
# because that parenting is per-platform, and this app ships on Windows.
wry = "0.55"
# The handle wry needs, at the version iced_runtime already exposes.
raw-window-handle = "0.6"
# Job object with kill-on-close, so a crash cannot orphan the server. See shell.rs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    # WS_CLIPCHILDREN on the app window, so the preview's child window survives
    # iced's swapchain present — see src/coder_browser.rs.
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
