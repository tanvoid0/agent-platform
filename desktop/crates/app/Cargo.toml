[package]
name = "agent-platform-desktop"
version = "0.2.0"
edition = "2021"
description = "Native desktop app for agent-platform (iced), owning the Python server sidecar"

[[bin]]
name = "agent-platform"
path = "src/main.rs"

[dependencies]
agent-platform-client = { path = "../client" }
iced = { version = "0.14", features = ["tokio", "canvas", "markdown", "svg", "image", "advanced"] }
tray-icon = "0.24"
tokio = { version = "1", features = ["rt-multi-thread", "time", "process"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
dark-light = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
rfd = { version = "0.15", features = ["common-controls-v6"] }
notify-rust = "4"
tts = "0.26"
msedge-tts = "0.2"
rodio = "0.19"
cpal = "0.15"
whisper-rs = "0.16"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
iced_fonts = { version = "0.3.0", features = ["lucide", "advanced_text"] }
# Decodes the frames inside icon.ico for the window and tray icons. Already in
# the tree via iced's svg backend, so this costs no extra build.
png = "0.17"
# ADR 0006: llama.cpp in-process. Optional because the feature adds a C++ build
# (and a CUDA Toolkit for the `cuda` build) that nothing else in this crate
# needs. `encoding_rs` is llama-cpp-2's own decoder type, so its version has to
# match the one llama-cpp-2 pins.
llama-cpp-2 = { version = "0.1.154", default-features = false, optional = true }
encoding_rs = { version = "0.8.35", optional = true }

[features]
default = []
# `dynamic-link` is not optional here: whisper-rs-sys already links its own copy
# of ggml statically, and two static ggmls in one binary is hundreds of
# LNK2005s. Building llama.cpp as DLLs keeps the duplicate symbols out of the
# link — at the cost of shipping those DLLs beside the exe.
local-llm = ["dep:llama-cpp-2", "dep:encoding_rs", "llama-cpp-2/dynamic-link"]
# Accelerator for the above. CPU-only was measured at 11 tok/s against 123 on
# the GPU, so a shipped build wants one of these, and each needs its own SDK
# installed — see desktop/spike-llama/README.md.
cuda = ["local-llm", "llama-cpp-2/cuda"]

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
