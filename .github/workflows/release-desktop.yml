# The iced app's release, separate from `release.yml` on purpose.
#
# `release.yml` is generated by `dist` and packages `agent-platformd` for four
# platforms. This one packages `agent-platform-desktop` for Windows, which is
# the only platform it has ever been built on — whisper.cpp through bindgen,
# WebView2, and a wgpu surface, none of it tried on mac or Linux (see the
# backlog's "macOS/Linux packaging").
#
# **Its own tag namespace, `desktop-v*`.** Two workflows on one tag would race
# to create the same GitHub Release, and the two components version
# independently anyway (server 0.1.x, app 0.2.x). `desktop-v0.2.0` releases the
# app; `v0.1.0` releases the daemon.
name: Release desktop

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. desktop-v0.2.0). Must already exist.'
        required: true

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: desktop (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Same reason as ci.yml: whisper-rs builds whisper.cpp through bindgen and
      # without this it fails with "Unable to find libclang" rather than
      # anything about whisper. The runner image installs LLVM here and does not
      # export a variable pointing at it.
      - run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      # The default feature set, matching what ships: `local-llm`/`cuda` need a
      # CUDA toolkit no hosted runner has.
      - run: cargo build --release -p agent-platform-desktop

      # The app spawns the daemon from its own directory, so the zip carries
      # both or the app starts and immediately cannot reach a server.
      - run: cargo build --release -p agent-platform-server

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.tag || github.ref_name }}" -replace '^desktop-v', ''
          $staging = "target/release/agent-platform-$version-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force $staging | Out-Null
          Copy-Item target/release/agent-platform.exe    $staging
          Copy-Item target/release/agent-platformd.exe   $staging
          Copy-Item ../README.md                         $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "$staging.zip" -Force
          (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $staging -Leaf) + ".zip" `
            | Out-File "$staging.zip.sha256" -Encoding ascii
          "ASSET_GLOB=desktop/$staging.zip*" >> $env:GITHUB_ENV

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Agent Platform Desktop ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ env.ASSET_GLOB }}
          fail_on_unmatched_files: true
          body: |
            Windows build of the Agent Platform desktop app.

            The zip carries both `agent-platform.exe` and `agent-platformd.exe`
            — the app spawns the daemon from its own directory, so they have to
            sit together. Unzip anywhere and run `agent-platform.exe`.

            The daemon on its own, for the four platforms it builds on, ships
            from the `v*` tags.
