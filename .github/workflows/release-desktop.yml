# The iced app's Windows build, as a `dist` custom job.
#
# It is not its own release. `dist-workspace.toml` lists this file in
# `local-artifacts-jobs`, so `dist` calls it during build-local-artifacts and
# folds whatever it uploads into the one release the `v*` tag produces — the
# daemon for four platforms and this zip, under a single tag. A second
# tag-triggered workflow was tried first and abandoned: two workflows on one
# tag race to create the same GitHub Release, and one of them loses.
#
# **Windows only**, because that is the only platform this app has ever been
# built on — whisper.cpp through bindgen and a wgpu surface, neither tried on
# mac or Linux (see the backlog's "macOS/Linux packaging"). `dist` has no
# per-package target list, which is why the app is `dist = false` there and
# arrives through here instead.
#
# The contract with `dist`: upload to an artifact named exactly `artifacts`,
# and a zip must have its files at the root rather than nested in a directory.
name: Release desktop

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (dist-manifest.json), passed by the calling workflow.
        required: true
        type: string

jobs:
  windows:
    name: desktop (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Same reason as ci.yml: whisper-rs builds whisper.cpp through bindgen and
      # without this it fails with "Unable to find libclang" rather than
      # anything about whisper. The runner image installs LLVM here and does not
      # export a variable pointing at it.
      #
      # `CMAKE` overrides the one in the tracked `desktop/.cargo/config.toml`,
      # which hardcodes a path inside Visual Studio **Community** on one
      # developer's machine. The runners have **Enterprise**, so that path does
      # not exist and the cmake crate fails with "The system cannot find the
      # path specified. (os error 3)" — nothing about cmake or whisper. Cargo's
      # `[env]` does not override a variable already set, so exporting it here
      # wins; the runner has cmake on PATH.
      - run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "CMAKE=cmake" >> $env:GITHUB_ENV
        shell: pwsh

      # `--profile dist` is the profile `dist` builds the daemon with, so the
      # two halves of one release are built the same way. Both binaries: the app
      # spawns the daemon from its own directory, so a zip with only the app is
      # an app that starts and cannot reach a server.
      #
      # The default feature set, matching what ships: `local-llm`/`cuda` need a
      # CUDA toolkit no hosted runner has.
      - name: Build
        working-directory: desktop
        run: cargo build --profile dist -p agent-platform-desktop -p agent-platform-server

      # The plan arrives through `env`, not interpolated into the script. It is
      # JSON containing the installers' own install lines — `curl --proto
      # '=https' --tlsv1.2 -LsSf …` — and those single quotes closed the
      # PowerShell string this used to sit in, leaving the rest to parse as
      # arguments: "A positional parameter cannot be found that accepts argument
      # '=https --tlsv1.2 -LsSf". The build had already succeeded; only the
      # packaging died, so the release had four daemons and no app.
      - name: Package
        shell: pwsh
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          $version = (ConvertFrom-Json $env:PLAN).announcement_tag -replace '^v', ''
          $name = "agent-platform-desktop-$version-x86_64-pc-windows-msvc"
          $stage = "staging/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item desktop/target/dist/agent-platform.exe  $stage
          Copy-Item desktop/target/dist/agent-platformd.exe $stage
          Copy-Item README.md                               $stage
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # Files at the zip root, not nested — dist's requirement for zips.
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/$name.zip" -Force
          $hash = (Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "artifacts/$name.zip.sha256" -Encoding ascii -NoNewline

      # The name is the contract: `dist` collects an artifact called `artifacts`
      # and attaches its contents to the release.
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-desktop-windows
          path: artifacts/*
