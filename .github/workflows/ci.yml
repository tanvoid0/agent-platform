# The repo's only automated check. Nothing ran the 490-odd tests before this;
# `cd desktop && cargo test` was a thing you had to remember.
#
# Two jobs, because the workspace does not build in one place:
#
# - `server` is the deployable artifact (Dockerfile, the cloud target of
#   ADR 0007). It has no GUI or audio dependencies, so it builds on Linux and
#   that is what the image is built from — the platform worth gating on.
# - `desktop` is iced + whisper.cpp + WebView2 and ships on Windows only, so it
#   is checked there. cmake and LLVM are both preinstalled on `windows-latest`;
#   `LIBCLANG_PATH` is not exported by default and bindgen needs it.
#
# `cargo build` runs alongside `cargo test` on purpose: dev-dependencies unify
# features back into the lib, so a test run alone can pass on a lib whose own
# feature list is missing something it uses. That is in the runbook and it is
# the exact failure this catches.
name: CI

on:
  push:
    branches: [main, rust-server-migration]
  pull_request:
  workflow_dispatch:

# A second push should cancel the first: this matrix includes a Windows
# whisper.cpp build, and running two to completion for the same ref is minutes
# of runner time nobody reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A CI failure should name the panic, not a pointer.
  RUST_BACKTRACE: 1

jobs:
  server:
    name: server (linux)
    runs-on: ubuntu-latest
    # The Postgres half of `tests/postgres_schema.rs`. Without a DSN that test
    # skips itself and says so, which is fine on a laptop and not fine here —
    # this job is the only place the Postgres dialect is ever exercised.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agent_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Not `DATABASE_URL`: `Config::from_env` refuses to start the server with
      # that set, and the rest of the suite starts servers.
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/agent_platform
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo build -p agent-platform-server
      - run: cargo test -p agent-platform-server -p agent-platform-client
      # Warnings are not failures yet: this repo has never been gated and
      # turning `-D warnings` on in the same commit that adds CI would make the
      # first run red for reasons unrelated to the change under review. Tighten
      # once the backlog it prints is empty.
      - run: cargo clippy -p agent-platform-server -p agent-platform-client --all-targets

  desktop:
    name: desktop (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # whisper-rs builds whisper.cpp through bindgen; without this it fails
      # with "Unable to find libclang" rather than anything about whisper.
      # Hardcoded rather than read from an env var: the runner image installs
      # LLVM here and does not export a variable pointing at it.
      #
      # `CMAKE` overrides the one in the tracked `desktop/.cargo/config.toml`,
      # which points inside Visual Studio **Community** on one developer's
      # machine. These runners have **Enterprise**, so that path does not exist
      # and the cmake crate dies with "The system cannot find the path
      # specified. (os error 3)" — a message about neither cmake nor whisper.
      # This job had never actually run when that file was written. Cargo's
      # `[env]` yields to a variable already set, so exporting it here wins.
      - run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "CMAKE=cmake" >> $env:GITHUB_ENV
        shell: pwsh
      # The default feature set: `local-llm`/`cuda` need a CUDA toolkit no
      # hosted runner has, and the app ships with them off.
      - run: cargo build -p agent-platform-desktop
      - run: cargo test -p agent-platform-desktop

  hygiene:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_repo_hygiene.py
      # The shape half of openapi drift. `tests/openapi_drift.rs` proves every
      # documented operation reaches a handler; this proves the request bodies
      # still look like their schemas. Cheap enough to sit in the same job.
      - run: python scripts/check_openapi_request_drift.py
