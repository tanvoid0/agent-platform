# GPU training worker profile — the model-ops build pipeline, with torch.
#
# This is the one piece of the platform that is still Python, and it is not a
# server: `agent-platformd` runs a stage by spawning it. To use this container
# as that interpreter, set MODEL_OPS_PYTHON on the server to a command that
# execs into here (or run the stages by hand — see worker/README.md).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.train.yml --profile train up --build
#
# Requires NVIDIA Container Toolkit on the host for GPU access.

services:
  train:
    profiles: ["train"]
    image: agent-platform-train:${AGENT_PLATFORM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.train
    entrypoint: ["sleep", "infinity"]
    environment:
      # No database and no CONFIG_PATH: the worker touches neither. It reads
      # and writes files under MODEL_OPS_DATA_DIR and reports results to
      # whoever spawned it on stdout — that is what let the build-job routes
      # leave Python (ADR 0007), and it is why this container shares only the
      # data volume with the server.
      MODEL_OPS_DATA_DIR: /app/data/llm/model_ops
      CONFIG_DIR: /app/data/llm
      # `eval` calls Ollama directly.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    env_file:
      - .env
    volumes:
      - agent_platform_data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"

volumes:
  agent_platform_data:
