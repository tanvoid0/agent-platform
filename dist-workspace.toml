# Release packaging, generated into `.github/workflows/release.yml` by
# `dist generate`. **One tag, `v<version>`, one release, both artifacts** — the
# daemon for four platforms and the Windows app zip.
#
# This file is at the repo root and the Cargo workspace is not: GitHub only
# reads `.github/workflows/` from the root, and `dist`'s own config has to live
# beside the thing it writes. `members` is what bridges the two.
#
# **`dist` itself packages only the server.** `agent-platform-desktop` is
# `dist = false` in its own manifest: it links whisper.cpp through bindgen and
# has only ever been built on Windows, and `dist` has no per-package target
# list — so letting it package the app would mean a release that reliably fails
# on three platforms of four. The app arrives instead as the custom job below.
#
# **The two crates are versioned in lockstep**, because `dist` derives the tag
# from the version: a skew is two tags for one product. `desktop/crates/server`
# was moved 0.1.0 → 0.2.0 to meet the app.

[workspace]
members = ["cargo:desktop"]

[dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
# The iced app's Windows build, folded into this release rather than given a
# release of its own — the app and the daemon ship together, and the app's zip
# carries both exes because it spawns the daemon from its own directory. A
# second tag-triggered workflow was tried first: two workflows on one tag race
# to create the same GitHub Release. This runs inside the same one, so there is
# nothing to race.
local-artifacts-jobs = ["./release-desktop"]
packages = ["agent-platform-server"]
# `shell` and `powershell` are the two that need no package manager and no
# signing story. The daemon is a single file with its migrations embedded, so
# an installer is a download and a PATH entry.
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Tag pushes only. `dist plan` still runs on PRs so a config that cannot
# release is caught before the tag, not after it.
pr-run-mode = "plan"
install-updater = true
